<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse-Typer</title>
</head>

<body>

<h1>Verse-Typer</h1>
<p class="tagline">Pick a verse, click it, and type it from start to finish.</p>

<div class="controls">
    <select id="verse-select"></select>
    <button id="restart-button">Restart</button>
    <button id ="random-button">Random</button>
    <button id="memory-button">Memory: Off</button>
    <button id="reset-button">Reset this verse</button>
    <button id="add-toggle">+ Add verse</button>
    <button id="delete-button">Delete verse</button>
</div>

<form id="add-form" hidden>
    <input id="new-ref" type="text" placeholder="Reference (e.g. Jonah 1:1-2)">
    <textarea id="new-text" rows="3" placeholder="Paste the verse text here"></textarea>
    <button type="submit">Save verse</button>
</form>


<p id="reference"></p>
<p id="level"></p>
<p id="best"></p>
<div id="verse"></div>

<p id="message"></p>
<p id="stats"></p>

<div class="backup">
    <button id="export-button">Export progress</button>
    <button id="import-button">Import progress</button>
    <input type="file" id="import-file" accept=".json" hidden>
</div>

<textarea id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>


<script src="script.js"></script>
</body>
</html>
