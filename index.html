<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse-Typer</title>
</head>

<body>

<h1>Verse-Typer</h1>
<p class="tagline">Pick a verse, click it, and type it from start to finish.</p>

<div class="controls">
    <select id="verse-select"></select>
    <button id="restart-button">Restart</button>
    <button id ="random-button">Random</button>
</div>

<label class="toggle">
    <input type="checkbox" id="memory-toggle"> Memory Mode
</label>

<p id="reference"></p>
<div id="verse"></div>

<p id="message"></p>
<p id="stats"></p>

<textarea id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>


<script src="script.js"></script>
</body>
</html>
